version: "3.9"

services:
  db:
    image: postgres:15
    container_name: incident_tracker_db
    restart: always
    environment:
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: incident_tracker
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
  redis:
    image: redis:7
    container_name: incident_tracker_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
  api:
    build: .
    container_name: incident_tracker_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://incident_user:strongpassword@db:5432/incident_tracker
      SECRET_KEY: dev-secret-key
      JWT_SECRET_KEY: jwt-secret-key
      REDIS_URL: redis://redis:6379
    ports: 
      - "5000:5000" 
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M  

volumes:
  postgres_data: